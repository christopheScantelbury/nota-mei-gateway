name: Deploy

# Só roda quando algo que entra na imagem da API mudou.
#
# A integração Git do Railway já deploya `api` e `worker` a cada push na main.
# Este `railway up` é um SEGUNDO deploy da API por cima desse. Quando nada da
# API mudou, o Railway marca os dois como SKIPPED ("No changes to watched
# files"), então rodar este job nesses pushes é só gasto de Actions — o filtro
# abaixo evita a execução inútil. Conferido no histórico de deployments do
# Railway em 2026-11-13.
#
# A lista espelha os watchPatterns de railway.toml (config do serviço `api`).
# Mantenha os dois em sincronia.
#
# Este arquivo NÃO está na lista de propósito: editar o workflow não precisa
# de deploy. Para forçar um: `railway up` (CLI) ou Redeploy no painel.
#
# Pendências conhecidas (fora deste arquivo):
#   - Quando a API muda, ela é deployada duas vezes (integração Git + este job).
#   - O `worker` (apps/api/railway.worker.toml) não tem watchPatterns e é
#     redeployado em TODO push na main, inclusive docs e migrations.
on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/api/**'
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'railway.toml'

jobs:
  deploy-api:
    name: Deploy API → Railway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        env:
          REF_NAME: ${{ github.ref_name }}
          RAILWAY_TOKEN_MAIN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_TOKEN_STAGING: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          SVC_PROD: ${{ vars.RAILWAY_SERVICE_PROD }}
          SVC_STAGING: ${{ vars.RAILWAY_SERVICE_STAGING }}
        run: |
          SPROD="${SVC_PROD:-api}"
          SSTG="${SVC_STAGING:-api-staging}"
          if [ "$REF_NAME" = "main" ]; then
            if [ -z "$RAILWAY_TOKEN_MAIN" ]; then
              echo "::notice title=Deploy API (prod)::RAILWAY_TOKEN não definido — deploy ignorado."
              exit 0
            fi
            export RAILWAY_TOKEN="$RAILWAY_TOKEN_MAIN"
            railway up --service "$SPROD" --detach
          else
            if [ -z "$RAILWAY_TOKEN_STAGING" ]; then
              echo "::notice title=Deploy API (staging)::RAILWAY_TOKEN_STAGING não definido — deploy develop ignorado."
              exit 0
            fi
            export RAILWAY_TOKEN="$RAILWAY_TOKEN_STAGING"
            railway up --service "$SSTG" --detach
          fi

  # deploy-web removido: Vercel Git integration já faz deploy automático no push.
  # Rodar vercel --prod via CLI em paralelo causava dois builds simultâneos com
  # cache conflict — o CLI restaurava cache antigo e sobrescrevia o build correto.

  # indexnow movido para .github/workflows/indexnow.yml: ele depende do deploy
  # do Vercel (web), não do Railway, e com o filtro de paths acima deixaria de
  # rodar em mudanças só de apps/web.
